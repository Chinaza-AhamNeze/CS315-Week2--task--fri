<!DOCTYPE html>
<html lang="en">
<head>

        table, th, td {

            border-collapse: collapse; 
            padding: 8px; }
        th { background-color: #f2f2f2; }

</head>

            <tr>
                <td>102</td>

            <tr>

            </tr>
        </tbody>

</body>
</html>
